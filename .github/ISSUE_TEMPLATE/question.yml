name: Question
description: Ask about installation, models or SSH. 설치, 모델, SSH에 대해 질문하세요.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MacAIterm version and macOS version
      placeholder: 0.1.0 on macOS 15.2
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, passwords and private server details.
          required: true
